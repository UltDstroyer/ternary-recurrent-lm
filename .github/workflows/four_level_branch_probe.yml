name: Four-level branch probe smoke
on:
  push:
    branches:
      - experiment/four-level-branch-comparison
    paths:
      - scripts/four_level_branch_probe.py
      - scripts/run_four_level_branch_probe.sh
      - .github/workflows/four_level_branch_probe.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: PyTorch and three-way CPU smoke
        run: |
          python -c "import torch; print('PyTorch', torch.__version__, 'CUDA', torch.cuda.is_available())"
          bash scripts/run_four_level_branch_probe.sh --device cpu --steps 2
          bash scripts/run_four_level_branch_probe.sh --device cpu --passes 6 --steps 400 --train-count 2048 --validation-count 256 --batch-size 8 --output results/four_level_branch_pilot.json
      - name: WikiText-2 held-out next-byte pilot
        continue-on-error: true
        run: bash scripts/run_four_level_branch_probe.sh --device cpu --dataset wikitext2 --passes 6 --steps 400 --train-count 4096 --validation-count 256 --batch-size 8 --output results/four_level_branch_wikitext2.json
      - name: Full-size architecture CPU shape check
        continue-on-error: true
        run: bash scripts/run_four_level_branch_probe.sh --device cpu --full-size --steps 1 --train-count 16 --validation-count 8 --batch-size 1 --output results/four_level_branch_full_size_shapecheck.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-level-branch-smoke
          path: results/four_level_branch_*.json
          if-no-files-found: ignore
