name: Four-level branch probe smoke
on:
  push:
    branches:
      - experiment/four-level-branch-comparison
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: PyTorch and three-way CPU smoke
        run: |
          python -c "import torch; print('PyTorch', torch.__version__, 'CUDA', torch.cuda.is_available())"
          bash scripts/run_four_level_branch_probe.sh --device cpu --steps 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-level-branch-smoke
          path: results/four_level_branch_probe.json
          if-no-files-found: ignore
