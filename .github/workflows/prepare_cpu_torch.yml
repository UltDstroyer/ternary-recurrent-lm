name: Transfer CPU PyTorch wheel for local comparison
on:
  push:
    branches:
      - experiment/expanded-branch-cpu
    paths:
      - .github/workflows/prepare_cpu_torch.yml
jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip download --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0+cpu' --dest wheelhouse
          mkdir -p wheel_chunks wheel_dependencies
          split -b 20m -d -a 2 wheelhouse/torch-2.14.0+cpu-*.whl wheel_chunks/part-
          rm wheelhouse/torch-2.14.0+cpu-*.whl
          mv wheelhouse/*.whl wheel_dependencies/
          echo "chunk count: $(find wheel_chunks -type f | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-dependencies
          path: wheel_dependencies/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-00
          path: wheel_chunks/part-00
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-01
          path: wheel_chunks/part-01
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-02
          path: wheel_chunks/part-02
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-03
          path: wheel_chunks/part-03
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-04
          path: wheel_chunks/part-04
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-05
          path: wheel_chunks/part-05
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-06
          path: wheel_chunks/part-06
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-07
          path: wheel_chunks/part-07
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-08
          path: wheel_chunks/part-08
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: torch-cpu-part-09
          path: wheel_chunks/part-09
          retention-days: 1
