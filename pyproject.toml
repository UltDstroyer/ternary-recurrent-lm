[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ternary-recurrent-lm"
version = "0.2.0"
description = "A recurrent language model with ternary weights, external memory, and adaptive halting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
eeg = ["mne>=1.6", "scikit-learn>=1.4", "scipy>=1.11"]

[project.scripts]
trlm-train = "trlm.train:main"
trlm-ablate = "trlm.experiment:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

